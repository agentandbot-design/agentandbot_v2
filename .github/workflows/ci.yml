# Anti-Crash Manifesto: CI/CD Quality Gate
#
# Her push ve PR'da otomatik olarak:
# 1. Dependency'leri kur
# 2. Compile (warnings-as-errors)
# 3. Credo lint
# 4. Test (migrate + run)
# 5. Dialyzer type analysis (PLT cached for speed)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Compile + Lint + Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DB_HOST: localhost
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27"

      - name: Setup Node (for impeccable detect)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            mix.lock
          key: ${{ runner.os }}-elixir-${{ hashFiles('**/mix.exs') }}
          restore-keys: ${{ runner.os }}-elixir-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatted
        run: mix format --check-formatted

      - name: Detect AI slop (impeccable)
        run: |
          # Tasarım anti-pattern'lerini (AI slop) engelle: gradient text, mor palet,
          # iç içe kartlar, aşırı kullanılan fontlar, side-tab, kontrast vs.
          # Kaynak CSS/şablonları tara; priv/static (build çıktısı) hariç tutulur.
          # exit 0 = temiz, exit 2 = anti-pattern bulundu (fail), çıktı JSON.
          # Sürüm pinli: npx son sürümü çekmemesi için @3.6.1 ile sabitlendi.
          npx -y impeccable@3.6.1 detect \
            apps/agentbot_web/lib/agentbot_web/live \
            apps/agentbot_web/lib/agentbot_web/templates \
            apps/agentbot_web/assets/css \
            --json

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Setup database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Run Credo lint
        run: mix credo --strict

      - name: Run tests
        run: mix test --trace

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: |
            apps/agentbot_core/.plts
            apps/agentbot_web/.plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-

      - name: Build PLT (first run / cache miss)
        run: |
          mix dialyzer --plt
        continue-on-error: true  # PLT derleme uyarılarını yoksay, asıl dialyzer kontrol eder

      - name: Run Dialyzer
        run: |
          mix dialyzer --no-compile --no-check --format short
