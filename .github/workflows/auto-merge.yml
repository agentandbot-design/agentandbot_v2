# Auto-Merge: Kalite kapısından geçen PR'ları otomatik olarak main'e birleştirir.
#
# Tetikleyiciler:
#   - pull_request opened/synchronize/reopened/ready_for_review
#   - workflow_run "CI" completed  (CI bittiğinde, beklemedeki PR'ları tara)
#   - workflow_dispatch            (manuel)
#
# Strateji: Poll döngüsü YOK. GitHub'ın yerleşik auto-merge'ini (gh pr merge --auto)
# kullanır — PR mergeable olduğunda ve required check'ler geçtiğinde GitHub kendisi
# merge eder. Workflow sadece PR'lara --auto bayrağını takar; gerisini GitHub halleder.
#
# Davranış:
#   - PR draft değilse ve "NO_AUTO_MERGE"/"WIP" etiketi yoksa --auto takılır.
#   - Kaynak branch merge sonrası otomatik silinir (--delete-branch).
#   - Manuel "Run workflow" düğmesiyle de tüm açık PR'lara --auto takılır.

name: Auto-Merge to Main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Enable auto-merge on eligible PRs
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          # Hedef set: trigger'dan gelen PR (+ CI bitince tüm açık PR'lar)
          TARGETS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGETS="${{ github.event.pull_request.number }}"
          fi

          for PR in $TARGETS $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 40 --json number --jq '.[].number'); do
            echo "===== PR #$PR ====="

            # Draft / kapalı ise atla
            META=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,isDraft \
              --jq '{s:.state,d:.isDraft}')
            S=$(echo "$META" | jq -r '.s')
            D=$(echo "$META" | jq -r '.d')
            if [ "$S" != "OPEN" ] || [ "$D" = "true" ]; then
              echo "PR #$PR state=$S draft=$D — atlandı"
              continue
            fi

            # Engel etiketi
            LABELS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | join(",")')
            if echo "$LABELS" | grep -qE "NO_AUTO_MERGE|WIP|wip"; then
              echo "PR #$PR '$LABELS' etiketli — auto-merge kapatıldı/yok"
              continue
            fi

            # Auto-merge zaten açık mı kontrol et, değilse aç
            AUTO=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.auto_merge')
            if [ "$AUTO" = "null" ]; then
              echo "==> PR #$PR için auto-merge açılıyor (merge + delete-branch)"
              gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" \
                --auto --merge --delete-branch || {
                echo "PR #$PR --auto talebi başarısız (mergeable değil?) — GitHub bekleyecek"
              }
            else
              echo "PR #$PR auto-merge zaten açık — atlandı"
            fi
          done

          echo "Done. GitHub, required check'ler geçen PR'ları kendisi merge edecek."