# Auto-Merge: Kalite kapısından geçen PR'ları otomatik olarak main'e birleştirir.
#
# Tetikleyiciler:
#   - pull_request opened/synchronize/reopened/ready_for_review
#   - workflow_run "CI" completed  (CI bittiğinde, PR'ları tara)
#   - workflow_dispatch            (manuel)
#
# Davranış:
#   - PR draft değilse ve birleştirme engeli yoksa, CI (quality-gate) yeşil
#     olunca --merge ile main'e birleştirir, kaynak branch'i siler.
#   - "NO_AUTO_MERGE" / "WIP" etiketi taşıyan PR'a dokunmaz.

name: Auto-Merge to Main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge green PRs
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          # Hedef PR kümesi: trigger'dan gelen PR + CI bitince tüm açık PR'lar
          TARGETS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGETS="${{ github.event.pull_request.number }}"
          fi

          for PR in $TARGETS $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 40 --json number --jq '.[].number'); do
            echo "===== PR #$PR ====="

            # Draft / kapalı / merge edilemezse atla
            META=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,isDraft,mergeable \
              --jq '{s:.state,d:.isDraft,m:.mergeable}')
            S=$(echo "$META" | jq -r '.s')
            D=$(echo "$META" | jq -r '.d')
            M=$(echo "$META" | jq -r '.m')
            if [ "$S" != "OPEN" ] || [ "$D" = "true" ]; then
              echo "PR #$PR state=$S draft=$D — atlandı"
              continue
            fi

            # Engel etiketi
            LABELS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | join(",")')
            if echo "$LABELS" | grep -qE "NO_AUTO_MERGE|WIP|wip"; then
              echo "PR #$PR '$LABELS' etiketli — otomatik merge yok"
              continue
            fi

            # CI'nin PR için başarılı olduğundan emin ol (poll, ~4 dk)
            echo "CI check bekleniyor: #$PR"
            CI_OK=""
            for i in $(seq 1 20); do
              CHECKS=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)
              # Başarısız/kayıp bir check varsa devam etme
              if echo "$CHECKS" | grep -qiE "fail|error|timeout|cancel"; then
                echo "PR #$PR başarısız check var — merge edilmedi"
                CI_OK="fail"
                break
              fi
              # En az bir check geçtiyse ve beklemede yoksa tamam
              if echo "$CHECKS" | grep -qE "pass" && ! echo "$CHECKS" | grep -qE "pending|expected|queued"; then
                CI_OK="ok"
                break
              fi
              echo "  (CI sürüyor... $i)"
              sleep 12
            done
            [ "$CI_OK" = "ok" ] || { echo "PR #$PR CI yeşil değil — atlandı"; continue; }

            sleep 2
            echo "==> Merging PR #$PR"
            if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" \
                 --merge --delete-branch \
                 --subject "Auto-merge PR #$PR (green CI)"; then
              echo "PR #$PR merge girişimi başarısız (çakışma/enge) — atlandı"
            fi
          done
