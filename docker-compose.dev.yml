services:
  dev:
    build:
      context: ./docker
      dockerfile: dev.Dockerfile
    container_name: agentbot-dev
    # Canlıya hizmet veren süreç (agentandbot.com → NPM → agentbot-dev:4000):
    # deps.get + migrate + phx.server — container recreate sonrası self-heal.
    # DB henüz hazır değilse sınırlı retry ile yeniden dener.
    command: >
      bash -c "
        cd /app
        mix deps.get --only dev
        for i in $$(seq 1 10); do
          mix ecto.migrate && break
          echo \"DB hazır değil, retry ($$i/10)...\"; sleep 5
        done
        exec mix phx.server
      "
    restart: unless-stopped
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./lib:/app/lib
      - ./test:/app/test
      - ./priv:/app/priv
      - ./mix.exs:/app/mix.exs
      - ./deps:/app/deps
      - ./.formatter.exs:/app/.formatter.exs
      - ./.credo.exs:/app/.credo.exs
      - mix-cache:/root/.mix
      - node-cache:/root/.npm
      - build-cache:/app/_build
    environment:
      - MIX_ENV=dev
      - DATABASE_URL=ecto://postgres:postgres@core-postgres:5432/agentbot_dev
      - MEM_LOCAL_API_KEY=iUyxjj-q7XZkZ15w5xZQzWMVmt3VLXNAqqE2-BtFT-g
      - MEM0_API_KEY=m0-1Ldss9uQU56BklrHoFPqT15iPN3Re3aJAo9oR5KL
      - MEM0_MCP_URL=https://mcp.mem0.ai/mcp/
    networks:
      - internal-network
      - proxy-network
    stdin_open: true
    tty: true
    working_dir: /app

volumes:
  mix-cache:
    name: agentbot-mix-cache
  node-cache:
    name: agentbot-node-cache
  build-cache:
    name: agentbot-build-cache

networks:
  internal-network:
    external: true
  proxy-network:
    external: true
